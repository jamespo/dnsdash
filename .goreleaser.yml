version: 2

before:
  hooks:
    - go mod tidy
builds:
  - id: dnsdash
    binary: dnsdash
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags: -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

nfpms:
  - ids:
      - dnsdash
    vendor: jamespo
    homepage: "https://github.com/jamespo/dnsdash"
    maintainer: "James Powell <jamespo@gmail.com>"
    description: "Self-hosted web tool for DNS lookups and mail checks"
    formats:
      - apk
      - deb
      - rpm
    bindir: /usr/bin

checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
